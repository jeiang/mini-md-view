name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Format
        run: nix develop -c zig fmt --check build.zig src tools
      - name: Test
        run: nix develop -c zig build test --summary all
      - name: Package
        run: nix build -L
